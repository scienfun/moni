[env:moni]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
extra_scripts = pre:scripts/secrets.py
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  -D MONI_BACKLIGHT_PIN=5
  -D MONI_BACKLIGHT_ACTIVE_LOW=1

[env:moni-ota]
extends = env:moni
upload_protocol = espota
upload_port = moni.local
upload_flags = --auth=${sysenv.MONI_OTA_PASSWORD}

; M3 수용 시험 전용: POST /api/debug/crash 가 포함된다.
[env:moni-debug]
extends = env:moni
build_flags =
  ${env:moni.build_flags}
  -D MONI_DEBUG_CRASH=1
