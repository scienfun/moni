[project]
name = "moni-bridge"
version = "0.1.0"
description = "모니 음성 캐릭터 브리지"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.80",
  "pillow>=11",
]

[project.scripts]
moni-bridge = "moni_bridge.server:main"
moni = "moni_bridge.cli:main"
moni-sim = "moni_bridge.sim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moni_bridge"]
